<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Imperativo versus declarativo: quem atualiza a tela">
  <text x="0" y="14" font-size="9.5" font-weight="800" letter-spacing="1.1" class="f-bad">IMPERATIVO · VOCÊ ATUALIZA O DOM</text>
  <g font-size="10.5">
    <rect x="0" y="24" width="92" height="40" rx="6" class="f-alt"/><text x="46" y="48" text-anchor="middle" font-weight="700" class="f-ink">clique</text>
    <rect x="102" y="24" width="92" height="40" rx="6" class="f-alt"/><text x="148" y="42" text-anchor="middle" font-weight="700" class="f-ink">muda</text><text x="148" y="56" text-anchor="middle" class="mono f-mut">pacientes[]</text>
    <rect x="204" y="24" width="196" height="40" rx="6" class="f-bads s-badl" stroke-width="1"/><text x="216" y="42" font-weight="700" class="f-ink">acha e altera cada nó</text><text x="216" y="56" class="mono f-mut">lista · contador · badge</text>
  </g>
  <g class="mono" font-size="10">
    <rect x="204" y="72" width="62" height="24" rx="4" class="f-bads"/><text x="235" y="88" text-anchor="middle" class="f-bad">#lista</text>
    <rect x="271" y="72" width="62" height="24" rx="4" class="f-bads"/><text x="302" y="88" text-anchor="middle" class="f-bad">#total</text>
    <rect x="338" y="72" width="62" height="24" rx="4" class="f-bads"/><text x="369" y="88" text-anchor="middle" class="f-bad">#alto</text>
  </g>
  <text x="0" y="122" font-size="11" class="f-soft">Esqueceu um dos três? A tela mente e nenhum erro aparece.</text>
  <line x1="0" y1="140" x2="400" y2="140" stroke-dasharray="2 4" stroke-width="1" class="s-bord"/>
  <text x="0" y="166" font-size="9.5" font-weight="800" letter-spacing="1.1" class="f-good">DECLARATIVO · VOCÊ DESCREVE, O REACT ATUALIZA</text>
  <g font-size="10.5">
    <rect x="0" y="176" width="92" height="40" rx="6" class="f-alt"/><text x="46" y="200" text-anchor="middle" font-weight="700" class="f-ink">clique</text>
    <rect x="102" y="176" width="92" height="40" rx="6" class="f-goods s-goodl" stroke-width="1"/><text x="148" y="194" text-anchor="middle" font-weight="700" class="f-ink">setPacientes</text><text x="148" y="208" text-anchor="middle" class="mono f-mut">novo estado</text>
    <rect x="204" y="176" width="92" height="40" rx="6" class="f-alt"/><text x="250" y="194" text-anchor="middle" font-weight="700" class="f-ink">render</text><text x="250" y="208" text-anchor="middle" class="mono f-mut">UI = f(estado)</text>
    <rect x="306" y="176" width="94" height="40" rx="6" class="f-alt"/><text x="353" y="194" text-anchor="middle" font-weight="700" class="f-ink">commit</text><text x="353" y="208" text-anchor="middle" class="mono f-mut">só a diferença</text>
  </g>
  <g fill="none" stroke-width="1.6" class="s-mut"><path d="M92 196 h10"/><path d="M194 196 h10"/><path d="M296 196 h10"/><path d="M92 44 h10"/><path d="M194 44 h10"/></g>
  <text x="0" y="246" font-size="11" class="f-soft">Você escreve a tela uma vez, para qualquer estado.</text>
  <text x="0" y="263" font-size="11" class="f-soft">Esquecer um lugar deixa de ser possível.</text>
  <text x="0" y="292" font-size="11" font-weight="700" class="f-acc">O trabalho não sumiu: mudou de dono.</text>
</svg>
