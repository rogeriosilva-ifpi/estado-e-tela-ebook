<svg viewBox="0 0 400 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quando usar um efeito e o ciclo de setup e limpeza"><text x="0" y="14" font-size="9.5" font-weight="800" class="f-mut">ESTA LÓGICA PRECISA DE UM EFEITO?</text><rect x="0" y="26" width="248" height="40" rx="6" class="f-card s-bord" stroke-width="1"/><text x="12" y="51" font-size="10.5" font-weight="700" class="f-ink">Dá para calcular com props e estado?</text><line x1="248" y1="46" x2="262" y2="46" stroke-width="1.6" class="s-mut"/><path d="M256 42 L262 46 L256 50" fill="none" stroke-width="1.6" class="s-mut"/><rect x="266" y="26" width="134" height="40" rx="6" class="f-goods s-goodl" stroke-width="1.1"/><text x="333" y="51" font-size="10.5" font-weight="800" text-anchor="middle" class="f-good">calcule no render</text><text x="14" y="82" font-size="9.5" font-weight="700" class="f-mut">não</text><line x1="8" y1="66" x2="8" y2="88" stroke-width="1.4" class="s-mut"/><rect x="0" y="88" width="248" height="40" rx="6" class="f-card s-bord" stroke-width="1"/><text x="12" y="113" font-size="10.5" font-weight="700" class="f-ink">Acontece por causa de um clique ou envio?</text><line x1="248" y1="108" x2="262" y2="108" stroke-width="1.6" class="s-mut"/><path d="M256 104 L262 108 L256 112" fill="none" stroke-width="1.6" class="s-mut"/><rect x="266" y="88" width="134" height="40" rx="6" class="f-goods s-goodl" stroke-width="1.1"/><text x="333" y="113" font-size="10.5" font-weight="800" text-anchor="middle" class="f-good">ponha no handler</text><text x="14" y="144" font-size="9.5" font-weight="700" class="f-mut">não</text><line x1="8" y1="128" x2="8" y2="150" stroke-width="1.4" class="s-mut"/><rect x="0" y="150" width="248" height="40" rx="6" class="f-card s-bord" stroke-width="1"/><text x="12" y="175" font-size="10.5" font-weight="700" class="f-ink">Mantém algo fora do React em dia?</text><line x1="248" y1="170" x2="262" y2="170" stroke-width="1.6" class="s-mut"/><path d="M256 166 L262 170 L256 174" fill="none" stroke-width="1.6" class="s-mut"/><rect x="266" y="150" width="134" height="40" rx="6" class="f-accs s-accl" stroke-width="1.1"/><text x="333" y="175" font-size="10.5" font-weight="800" text-anchor="middle" class="f-acc">isso é um efeito</text><line x1="0" y1="218" x2="400" y2="218" stroke-dasharray="2 4" stroke-width="1" class="s-bord"/><text x="0" y="240" font-size="9.5" font-weight="800" class="f-mut">O CICLO DE UM EFEITO COM LIMPEZA</text><rect x="0" y="250" width="400" height="34" rx="6" class="f-infos s-infol" stroke-width="1"/><text x="12" y="272" font-size="11" font-weight="700" class="f-ink mono">termo = "ma"</text><text x="140" y="272" font-size="10.5" class="f-soft mono">setup: pede ?q=ma</text><rect x="0" y="292" width="400" height="34" rx="6" class="f-infos s-infol" stroke-width="1"/><text x="12" y="314" font-size="11" font-weight="700" class="f-ink mono">termo = "mar"</text><text x="140" y="314" font-size="10.5" class="f-soft mono">limpeza: abort(ma) · setup: pede ?q=mar</text><rect x="0" y="334" width="400" height="34" rx="6" class="f-alt s-bord" stroke-width="1"/><text x="12" y="356" font-size="11" font-weight="700" class="f-ink mono">sai da tela</text><text x="140" y="356" font-size="10.5" class="f-soft mono">limpeza: abort(mar)</text><text x="0" y="384" font-size="10.5" class="f-soft">StrictMode roda setup, limpeza e setup na montagem, em dev,</text><text x="0" y="400" font-size="10.5" class="f-soft">para provar que a limpeza desfaz o setup.</text></svg>
