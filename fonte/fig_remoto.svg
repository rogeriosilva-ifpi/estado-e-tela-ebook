<svg viewBox="0 0 400 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leitura passando pelo cache e mutação otimista com reversão e invalidação"><text x="0" y="14" font-size="9.5" font-weight="800" class="f-mut">LER</text><rect x="0" y="22" width="400" height="32" rx="6" class="f-card s-bord" stroke-width="1.1"/><text x="10" y="36" font-size="10.5" font-weight="800" class="f-ink mono">componente</text><text x="10" y="49" font-size="9.5" class="f-soft mono">useBusca(q, página)</text><line x1="30" y1="54" x2="30" y2="62" stroke-width="1.6" class="s-mut"/><path d="M26 56 L30 62 L34 56" fill="none" stroke-width="1.6" class="s-mut"/><rect x="22" y="62" width="378" height="32" rx="6" class="f-accs s-accl" stroke-width="1.1"/><text x="32" y="76" font-size="10.5" font-weight="800" class="f-acc mono">cache · QueryClient</text><text x="32" y="89" font-size="9.5" class="f-soft mono">chave → dado, fresco por 30 s</text><line x1="52" y1="94" x2="52" y2="102" stroke-width="1.6" class="s-mut"/><path d="M48 96 L52 102 L56 96" fill="none" stroke-width="1.6" class="s-mut"/><rect x="44" y="102" width="356" height="32" rx="6" class="f-infos s-infol" stroke-width="1.1"/><text x="54" y="116" font-size="10.5" font-weight="800" class="f-info mono">api/pacientes.ts</text><text x="54" y="129" font-size="9.5" class="f-soft mono">buscarPacientes() → pedir()</text><line x1="74" y1="134" x2="74" y2="142" stroke-width="1.6" class="s-mut"/><path d="M70 136 L74 142 L78 136" fill="none" stroke-width="1.6" class="s-mut"/><rect x="66" y="142" width="334" height="32" rx="6" class="f-alt s-bord" stroke-width="1.1"/><text x="76" y="156" font-size="10.5" font-weight="800" class="f-ink mono">API</text><text x="76" y="169" font-size="9.5" class="f-soft mono">GET /api/patients?q=&pagina=</text><text x="392" y="76" font-size="9" font-weight="700" text-anchor="end" class="f-good">fresco: responde sem rede</text><text x="0" y="196" font-size="9.5" font-weight="800" class="f-mut">MUDAR (EDITAR O NOME)</text><rect x="0" y="206" width="400" height="28" rx="5" class="f-goods s-goodl" stroke-width="1"/><text x="10" y="224" font-size="10" font-weight="800" class="f-good mono">1 onMutate</text><text x="118" y="224" font-size="9.5" class="f-soft">guarda o anterior e muda o cache</text><rect x="0" y="240" width="400" height="28" rx="5" class="f-infos s-infol" stroke-width="1"/><text x="10" y="258" font-size="10" font-weight="800" class="f-info mono">2 mutationFn</text><text x="118" y="258" font-size="9.5" class="f-soft">PATCH /api/patients/:id</text><rect x="0" y="274" width="400" height="28" rx="5" class="f-bads s-badl" stroke-width="1"/><text x="10" y="292" font-size="10" font-weight="800" class="f-bad mono">3a onError</text><text x="118" y="292" font-size="9.5" class="f-soft">devolve o anterior ao cache</text><rect x="0" y="308" width="400" height="28" rx="5" class="f-accs s-accl" stroke-width="1"/><text x="10" y="326" font-size="10" font-weight="800" class="f-acc mono">3b onSettled</text><text x="118" y="326" font-size="9.5" class="f-soft">invalida ["pacientes"]: todos buscam de novo</text></svg>
