<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluxo de dados de mão única e a comparação que o React faz no set"><rect x="0" y="0" width="400" height="64" rx="8" class="f-accs s-accl" stroke-width="1.2"/><text x="14" y="20" font-size="9.5" font-weight="800" class="f-acc">ALA · COORDENA</text><text x="14" y="39" font-size="11" font-weight="700" class="f-ink mono">estado: pacientes, selecionadoId</text><text x="14" y="55" font-size="11" class="f-soft mono">derivado: visiveis, selecionado</text><line x1="90" y1="64" x2="90" y2="104" stroke-width="1.6" class="s-good"/><path d="M86 98 L90 104 L94 98" fill="none" stroke-width="1.6" class="s-good"/><line x1="310" y1="64" x2="310" y2="104" stroke-width="1.6" class="s-good"/><path d="M306 98 L310 104 L314 98" fill="none" stroke-width="1.6" class="s-good"/><text x="98" y="88" font-size="10" font-weight="700" class="f-good">props</text><text x="318" y="88" font-size="10" font-weight="700" class="f-good">props</text><rect x="0" y="104" width="196" height="50" rx="8" class="f-goods s-goodl" stroke-width="1.1"/><text x="12" y="124" font-size="11" font-weight="700" class="f-ink mono">ListaPacientes</text><text x="12" y="142" font-size="10.5" class="f-soft mono">→ CartaoPaciente ×6</text><rect x="212" y="104" width="188" height="50" rx="8" class="f-goods s-goodl" stroke-width="1.1"/><text x="224" y="124" font-size="11" font-weight="700" class="f-ink mono">PainelDetalhe</text><text x="224" y="142" font-size="10" class="f-soft mono">paciente={selecionado}</text><path d="M40 104 V76" fill="none" stroke-width="1.6" stroke-dasharray="4 3" class="s-acc"/><path d="M36 82 L40 76 L44 82" fill="none" stroke-width="1.6" class="s-acc"/><text x="0" y="172" font-size="10.5" class="f-soft">Dados descem como props. Eventos sobem como</text><text x="0" y="188" font-size="10.5" class="f-soft">chamadas: onSelecionar(id), onPrioridade(id).</text><line x1="0" y1="204" x2="400" y2="204" stroke-dasharray="2 4" stroke-width="1" class="s-bord"/><text x="0" y="226" font-size="9.5" font-weight="800" class="f-mut">O QUE O REACT COMPARA NO set</text><rect x="0" y="236" width="400" height="46" rx="6" class="f-bads s-badl" stroke-width="1"/><text x="12" y="254" font-size="10.5" font-weight="700" class="f-ink mono">p.prioridade = …; setPacientes(pacientes)</text><text x="12" y="272" font-size="10.5" font-weight="700" class="f-bad">mesmo array → Object.is igual → sem render</text><rect x="0" y="290" width="400" height="46" rx="6" class="f-goods s-goodl" stroke-width="1"/><text x="12" y="308" font-size="10.5" font-weight="700" class="f-ink mono">setPacientes(pacientes.map(…))</text><text x="12" y="326" font-size="10.5" font-weight="700" class="f-good">array novo → diferente → render</text></svg>
