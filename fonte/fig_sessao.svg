<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Middleware antes do loader; 401 e 403 com a tela aberta"><text x="0" y="14" font-size="9.5" font-weight="800" class="f-mut">ENTRAR NUMA ROTA PROTEGIDA</text><rect x="0" y="22" width="400" height="30" rx="6" class="f-card s-bord" stroke-width="1.1"/><text x="200.0" y="41.0" font-size="10.5" font-weight="700" text-anchor="middle" class="f-ink mono">navegar para /pacientes/p1</text><line x1="200" y1="52" x2="200" y2="62" stroke-width="1.6" class="s-mut"/><path d="M196 56 L200 62 L204 56" fill="none" stroke-width="1.6" class="s-mut"/><rect x="0" y="64" width="400" height="40" rx="6" class="f-accs s-accl" stroke-width="1.1"/><text x="200.0" y="82.0" font-size="10.5" font-weight="700" text-anchor="middle" class="f-acc mono">middleware exigirSessao</text><text x="200.0" y="96.0" font-size="9" text-anchor="middle" class="f-soft">cache ["sessao"] ou GET /api/auth/me</text><line x1="100" y1="104" x2="100" y2="116" stroke-width="1.6" class="s-mut"/><path d="M96 110 L100 116 L104 110" fill="none" stroke-width="1.6" class="s-mut"/><line x1="300" y1="104" x2="300" y2="116" stroke-width="1.6" class="s-mut"/><path d="M296 110 L300 116 L304 110" fill="none" stroke-width="1.6" class="s-mut"/><rect x="0" y="118" width="194" height="40" rx="6" class="f-bads s-badl" stroke-width="1.1"/><text x="97.0" y="136.0" font-size="10.5" font-weight="700" text-anchor="middle" class="f-bad mono">null</text><text x="97.0" y="150.0" font-size="9" text-anchor="middle" class="f-soft">/entrar?volta=…, sem loader</text><rect x="206" y="118" width="194" height="40" rx="6" class="f-goods s-goodl" stroke-width="1.1"/><text x="303.0" y="136.0" font-size="10.5" font-weight="700" text-anchor="middle" class="f-good mono">usuário</text><text x="303.0" y="150.0" font-size="9" text-anchor="middle" class="f-soft">loader, depois a tela</text><text x="0" y="186" font-size="9.5" font-weight="800" class="f-mut">QUANDO A API RECUSA, COM A TELA ABERTA</text><rect x="0" y="194" width="194" height="64" rx="6" class="f-bads s-badl" stroke-width="1.1"/><text x="10" y="212" font-size="10.5" font-weight="800" class="f-bad mono">401 · sessão acabou</text><text x="10" y="228" font-size="9.5" class="f-soft mono">cache: ["sessao"] = null</text><text x="10" y="244" font-size="9.5" class="f-soft">Layout leva ao login e volta</text><rect x="206" y="194" width="194" height="64" rx="6" class="f-warns s-warnl" stroke-width="1.1"/><text x="216" y="212" font-size="10.5" font-weight="800" class="f-warn mono">403 · sem permissão</text><text x="216" y="228" font-size="9.5" class="f-soft">aviso no lugar</text><text x="216" y="244" font-size="9.5" class="f-soft">fica na página; login não ajuda</text></svg>
