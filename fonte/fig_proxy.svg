="11.5" font-weight="700" class="f-ink">sessão, permissões, pacientes</text><text x="0" y="314" font-size="11" class="f-soft">Para o navegador existe uma origem só. O cookie</text><text x="0" y="331" font-size="11" class="f-soft">de sessão vai junto e não há CORS no caminho.</text></svg>
