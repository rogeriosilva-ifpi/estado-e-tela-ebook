<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="As barreiras contra o envio duplo"><rect x="0" y="0" width="400" height="46" rx="8" class="f-alt s-bord" stroke-width="1.1"/><text x="14" y="20" font-size="11.5" font-weight="700" class="f-ink mono">CLIQUE</text><text x="14" y="37" font-size="10.5" class="f-soft">dois cliques no mesmo instante</text><line x1="200" y1="46" x2="200" y2="62" stroke-width="1.6" class="s-mut"/><path d="M196 56 L200 62 L204 56" fill="none" stroke-width="1.6" class="s-mut"/><rect x="0" y="62" width="400" height="46" rx="8" class="f-warns s-warnl" stroke-width="1.1"/><text x="14" y="82" font-size="11.5" font-weight="700" class="f-ink mono">disabled={pendente}</text><text x="14" y="99" font-size="10.5" class="f-soft">só depois do próximo render</text><text x="386" y="90" font-size="10.5" font-weight="800" text-anchor="end" class="f-warn">aviso visual · passa</text><line x1="200" y1="108" x2="200" y2="124" stroke-width="1.6" class="s-mut"/><path d="M196 118 L200 124 L204 118" fill="none" stroke-width="1.6" class="s-mut"/><rect x="0" y="124" width="400" height="46" rx="8" class="f-goods s-goodl" stroke-width="1.1"/><text x="14" y="144" font-size="11.5" font-weight="700" class="f-ink mono">useRef no onSubmit</text><text x="14" y="161" font-size="10.5" class="f-soft">no instante do clique</text><text x="386" y="152" font-size="10.5" font-weight="800" text-anchor="end" class="f-good">trava a mesma aba</text><line x1="200" y1="170" x2="200" y2="186" stroke-width="1.6" class="s-mut"/><path d="M196 180 L200 186 L204 180" fill="none" stroke-width="1.6" class="s-mut"/><rect x="0" y="186" width="400" height="46" rx="8" class="f-goods s-goodl" stroke-width="1.1"/><text x="14" y="206" font-size="11.5" font-weight="700" class="f-ink mono">409 no servidor</text><text x="14" y="223" font-size="10.5" class="f-soft">CNS já existe</text><text x="386" y="214" font-size="10.5" font-weight="800" text-anchor="end" class="f-good">trava qualquer aba</text><text x="0" y="256" font-size="10.5" class="f-soft">Medido no Chromium com a API real: só disabled deixa</text><text x="0" y="272" font-size="10.5" class="f-soft">dois prontuários; o ref segura a aba; o 409 segura o resto.</text></svg>
