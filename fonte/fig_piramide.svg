<svg viewBox="0 0 400 242" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pirâmide de testes: unidade, componente, aplicação com MSW e E2E; o mock do hook corta no lugar errado"><text x="0" y="14" font-size="9.5" font-weight="800" class="f-mut">ONDE CADA TESTE CORTA O SISTEMA</text><rect x="102.0" y="24" width="196" height="34" rx="6" class="f-accs s-accl" stroke-width="1.1"/><text x="200" y="38" font-size="10.5" font-weight="800" text-anchor="middle" class="f-acc mono">E2E · Playwright</text><text x="200" y="51" font-size="9" text-anchor="middle" class="f-soft">navegador, API e banco reais</text><rect x="69.0" y="64" width="262" height="34" rx="6" class="f-infos s-infol" stroke-width="1.1"/><text x="200" y="78" font-size="10.5" font-weight="800" text-anchor="middle" class="f-info mono">aplicação + MSW</text><text x="200" y="91" font-size="9" text-anchor="middle" class="f-soft">rotas, cache, fetch de verdade; rede falsa</text><rect x="36.0" y="104" width="328" height="34" rx="6" class="f-goods s-goodl" stroke-width="1.1"/><text x="200" y="118" font-size="10.5" font-weight="800" text-anchor="middle" class="f-good mono">componente</text><text x="200" y="131" font-size="9" text-anchor="middle" class="f-soft">o que a pessoa vê e faz, por papel e rótulo</text><rect x="3.0" y="144" width="394" height="34" rx="6" class="f-alt s-bord" stroke-width="1.1"/><text x="200" y="158" font-size="10.5" font-weight="800" text-anchor="middle" class="f-ink mono">unidade</text><text x="200" y="171" font-size="9" text-anchor="middle" class="f-soft">reducer, tokens: regras puras, sem tela</text><text x="0" y="192" font-size="9.5" class="f-soft">↑ mais lento, mais perto do usuário</text><text x="400" y="192" font-size="9.5" text-anchor="end" class="f-soft">mais rápido, mais preciso ↓</text><rect x="0" y="202" width="400" height="38" rx="6" class="f-bads s-badl" stroke-width="1.1"/><text x="10" y="217" font-size="10.5" font-weight="800" class="f-bad mono">vi.mock do hook</text><text x="10" y="232" font-size="9.5" class="f-soft">corta acima do HTTP: o teste passa com a rede quebrada</text></svg>
